<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="在浏览器里合并、拖拽排序和拆分 PDF 页面。">
<title>PDF 页面整理器 · Page Desk</title>
<link rel="stylesheet" href="styles.css">
<header>
  <div class="mast">
    <div><div class="brand">PAGE DESK</div><h1>PDF 页面整理器</h1></div>
    <a href="https://github.com/NIU866/pdf-page-sorter">GitHub 源码</a>
  </div>
</header>
<main>
  <section class="drop" id="drop" aria-label="导入 PDF">
    <div><strong>加入需要整理的 PDF</strong><p>拖入一份或多份文件，也可通过按钮选择。</p></div>
    <button class="primary" id="add">选择 PDF</button>
    <input id="files" type="file" accept=".pdf,application/pdf" multiple hidden>
  </section>
  <p class="status" id="status" role="status"></p>
  <div class="workspace">
    <section class="panel" aria-labelledby="page-heading">
      <div class="panel-title"><div><h2 id="page-heading">页面顺序</h2><p id="count">0 份文件 · 0 页</p></div><button id="reset" disabled>恢复导入顺序</button></div>
      <p class="empty" id="empty">导入 PDF 后，在这里拖动页面调整顺序。</p>
      <ol id="pages" class="pages"></ol>
    </section>
    <aside class="panel export" aria-labelledby="export-title">
      <h2 id="export-title">导出</h2>
      <label>页码范围
        <input id="range" placeholder="全部页面" autocomplete="off">
      </label>
      <p>按左侧当前页序填写，例 1,3–5。留空使用全部页面。</p>
      <button id="merge" class="primary" disabled>导出整理后的 PDF</button>
      <button id="split" disabled>拆为单页 ZIP</button>
      <p class="local">PDF 文件在浏览器内处理。</p>
      <button id="clear" class="quiet" disabled>清空工作区</button>
    </aside>
  </div>
</main>
<script type="module" src="app.mjs"></script>
</html>
